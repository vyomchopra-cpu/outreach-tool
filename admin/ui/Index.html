<!--
  Shell: styles, tab nav, and all client logic. The tab bodies are separate
  files (Compose/Audience/Launch/Health/Operations) included below; the script
  stays here, after every include, so it can bind to the whole DOM in one pass
  rather than each partial carrying its own fragment of state.

  Plain JS, no framework — this is a 2-3 admin internal tool, and
  google.script.run is the only transport, so there is no second API to keep
  in sync. Every gate this page shows is also enforced server-side: the UI
  makes the order obvious, it does not enforce it.
-->
<style>
  :root { color-scheme: light dark; --line:#8883; --muted:#888; --bad:#c0392b; --good:#1a7f37; --warn:#a67c00; }
  body { font-family:-apple-system, Segoe UI, Arial, sans-serif; margin:0; padding:20px 24px 60px; max-width:1200px; line-height:1.45; }
  h1 { font-size:19px; margin:0; }
  .hint, .sub { color:var(--muted); font-size:12.5px; }
  nav { display:flex; gap:4px; margin:14px 0 4px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav button { background:transparent; color:inherit; border:none; border-bottom:2px solid transparent;
               padding:8px 14px; font-size:13px; cursor:pointer; margin:0; border-radius:0; }
  nav button.active { border-bottom-color:currentColor; font-weight:600; }
  .tab { display:none; } .tab.active { display:block; }
  .step { border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:16px; }
  .step > h2 { font-size:14px; margin:0 0 6px; display:flex; align-items:center; gap:8px; }
  .num { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
         border-radius:50%; background:#1a1a1a; color:#fff; font-size:12px; flex:none; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  label { display:block; font-size:12px; font-weight:600; margin:12px 0 4px; }
  label .hint { font-weight:400; }
  input[type=text], input[type=number], textarea, select {
    width:100%; box-sizing:border-box; padding:8px; font-size:13px; border:1px solid #8886;
    border-radius:4px; font-family:inherit; background:transparent; color:inherit; }
  textarea { min-height:180px; font-family:ui-monospace, Consolas, monospace; font-size:12px; }
  button { padding:8px 14px; border-radius:4px; border:1px solid #8888; background:#1a1a1a; color:#fff;
           font-size:13px; cursor:pointer; margin:8px 8px 0 0; }
  button.secondary { background:transparent; color:inherit; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .senders label { display:inline-flex; align-items:center; gap:6px; font-weight:400; margin-right:16px; }
  .tokens { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .token { font-size:11px; padding:2px 8px; border-radius:10px; background:#8883; }
  .msg { font-size:12px; margin-top:6px; white-space:pre-wrap; }
  .msg.bad { color:var(--bad); } .msg.good { color:var(--good); }
  iframe.preview { width:100%; height:340px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  .row { padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; display:flex; justify-content:space-between; gap:12px; }
  .pill { font-size:11px; padding:2px 8px; border-radius:10px; background:#8883; white-space:nowrap; }
  .drop { border:2px dashed #8886; border-radius:6px; padding:18px; text-align:center; font-size:13px; color:var(--muted); cursor:pointer; margin-top:10px; }
  .drop.over { border-color:currentColor; }
  table.mini { width:100%; border-collapse:collapse; font-size:11.5px; margin-top:8px; }
  table.mini td, table.mini th { border:1px solid var(--line); padding:4px 6px; text-align:left;
                                 max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cards { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
  .card { border:1px solid var(--line); border-radius:6px; padding:10px 14px; min-width:120px; }
  .card b { display:block; font-size:20px; font-weight:600; }
  .card span { font-size:11.5px; color:var(--muted); }
  .bar { height:5px; border-radius:3px; background:#8883; overflow:hidden; margin-top:4px; }
  .bar > i { display:block; height:100%; background:currentColor; }
  code { background:#8882; padding:1px 4px; border-radius:3px; font-size:12px; }
</style>

<h1>MIS Outreach</h1>
<div class="sub">
  <span id="adminEmail"><?= adminEmail ?></span> ·
  single-touch pilot · 09:00–17:00 business days ·
  <span id="killSwitchState" class="pill">checking…</span>
  <button id="btnToggleKill" class="secondary" style="padding:2px 8px;font-size:11px;margin:0 0 0 6px">toggle</button>
</div>

<nav>
  <button data-tab="compose" class="active">1 · Compose</button>
  <button data-tab="audience">2 · Audience</button>
  <button data-tab="launch">3 · Launch</button>
  <button data-tab="health">Health</button>
  <button data-tab="ops">Operations</button>
</nav>

<div class="tab active" id="tab-compose"><?!= include_('ui/Compose') ?></div>
<div class="tab" id="tab-audience"><?!= include_('ui/Audience') ?></div>
<div class="tab" id="tab-launch"><?!= include_('ui/Launch') ?></div>
<div class="tab" id="tab-health"><?!= include_('ui/Health') ?></div>
<div class="tab" id="tab-ops"><?!= include_('ui/Operations') ?></div>

<script>
  let currentCampaignId = null;
  let pendingCsvText = null;
  let clientConfig = null;

  const $ = function (id) { return document.getElementById(id); };
  const esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  };
  const setMsg = function (id, text, cls) {
    const el = $(id); if (!el) return;
    el.textContent = text; el.className = 'msg' + (cls ? ' ' + cls : '');
  };
  const fail = function (id) { return function (err) { setMsg(id, 'Error: ' + err.message, 'bad'); }; };

  // ── tabs ──────────────────────────────────────────────────────
  document.querySelectorAll('nav button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('nav button').forEach(function (x) { x.classList.remove('active'); });
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      $('tab-' + b.dataset.tab).classList.add('active');
      if (b.dataset.tab === 'health') refreshHealth();
    };
  });

  // ── config ────────────────────────────────────────────────────
  google.script.run.withSuccessHandler(function (cfg) {
    clientConfig = cfg;
    $('senders').innerHTML = cfg.senderPool.length
      ? cfg.senderPool.map(function (s) {
          return '<label><input type="checkbox" value="' + esc(s.email) + '" checked> ' + esc(s.displayName) + '</label>';
        }).join('')
      : '<span class="hint">No senders in SENDER_POOL (shared/Config.gs).</span>';
    if (!cfg.seedMailboxCount) $('btnSeed').title = 'SEED_MAILBOXES is empty';

    const u = cfg.agentWebAppUrl;
    $('agentLinks').innerHTML = u ? ''
      + '<p><a href="' + u + '?diagnose=1" target="_blank">Diagnostics</a> — probe every capability; check this first when anything is odd</p>'
      + '<p><a href="' + u + '?testsend=1" target="_blank">Send myself a test</a> — proves the real send path end to end</p>'
      + '<p><a href="' + u + '?setup=1" target="_blank">Manual filter setup</a> — the Gmail filters that sort replies</p>'
      + '<p><a href="' + u + '?onboard=1" target="_blank">Onboard / re-onboard</a> — register, and (re)create the send trigger</p>'
      + '<p><a href="' + u + '?disconnect=1" target="_blank">Pause sending</a> — removes the trigger immediately</p>'
      : '<span class="hint">AGENT_WEBAPP_URL is not set in shared/Config.gs.</span>';

    $('rulesTable').innerHTML = '<table class="mini">'
      + row2('Send window', cfg.sendWindow.startHour + ':00 – ' + cfg.sendWindow.endHour + ':00, business days')
      + row2('Daily cap ramp', cfg.dailyCapRamp.map(function (t) { return 'day ' + t.afterDays + '+ → ' + t.cap; }).join(' · '))
      + row2('Agent poll', 'every ' + cfg.pollMinutes + ' min (limits how precise a send gap can be)')
      + row2('Seed mailboxes', cfg.seedMailboxes.length ? cfg.seedMailboxes.join(', ') : '(none configured)')
      + row2('Multi-touch sequences', cfg.allowMultiTouch ? 'allowed' : 'disabled — single-touch only while reply detection is unavailable')
      + row2('Max HTML size', cfg.maxHtmlBytes + ' bytes before Gmail clips')
      + '</table>';
  }).getClientConfig();

  function row2(k, v) { return '<tr><th>' + esc(k) + '</th><td style="white-space:normal">' + esc(v) + '</td></tr>'; }

  const selectedSenders = function () {
    return Array.from(document.querySelectorAll('#senders input:checked')).map(function (c) { return c.value; });
  };
  const currentInput = function () {
    return {
      name: $('name').value, subject: $('subject').value, preheader: $('preheader').value,
      bodySource: $('bodySource').value, senderPool: selectedSenders(),
      tzMode: $('tzMode').value, intervalMinutes: $('intervalMinutes').value,
    };
  };

  // ── compose ───────────────────────────────────────────────────
  $('btnLoadSample').onclick = function () {
    $('subject').value = $('subject').value || 'Quick question, {{firstName}}';
    $('preheader').value = $('preheader').value || '{{company}} — a quick thought';
    $('bodySource').value =
      '<p>Hi {{firstName}},</p>\n' +
      '<p>I noticed {{company}} is {{{intro_html}}} — most {{title}}s we speak to\n' +
      'hit the same commute-cost question about then.</p>\n' +
      '<p>Worth a short conversation?</p>\n' +
      '<p>Vyom<br>MoveInSync</p>\n' +
      '<p style="color:#888888;font-size:12px">Not relevant? Reply, or write to {{unsubscribe}}, and I will not contact you again.<br>\n' +
      'MoveInSync Technologies, Bengaluru, India</p>';
    setMsg('saveStatus', 'Sample loaded. It uses {{{intro_html}}} — your CSV needs an intro_html column, or remove that tag.', 'good');
  };

  $('btnSave').onclick = function () {
    setMsg('saveStatus', 'Saving…');
    const done = function (id) {
      currentCampaignId = id;
      setMsg('saveStatus', 'Saved as ' + id + '. Preview, then send a test.', 'good');
      $('btnSeed').disabled = false;
      $('btnImport').disabled = !pendingCsvText;
      refreshCampaigns(); doPreview();
    };
    if (currentCampaignId) {
      google.script.run.withSuccessHandler(function () { done(currentCampaignId); })
        .withFailureHandler(fail('saveStatus')).saveCampaignDraft(currentCampaignId, currentInput());
    } else {
      google.script.run.withSuccessHandler(done).withFailureHandler(fail('saveStatus')).createCampaign(currentInput());
    }
  };

  function doPreview() {
    if (!currentCampaignId) { setMsg('previewError', 'Save the draft first.', 'bad'); return; }
    google.script.run.withSuccessHandler(function (r) {
      $('tokens').innerHTML = (r.tokensInBody || [])
        .map(function (t) { return '<span class="token">{{' + esc(t) + '}}</span>'; }).join('');
      if (!r.ok) {
        setMsg('previewError', r.error, 'bad'); $('previewFrame').srcdoc = ''; setMsg('previewMeta', '');
        return;
      }
      setMsg('previewError', '');
      $('previewFrame').srcdoc = r.html;
      const over = r.bytes >= r.maxBytes;
      setMsg('previewMeta', 'Subject: ' + r.subject + '\nPreheader: ' + (r.preheader || '(none)')
        + '\n' + r.bytes + ' / ' + r.maxBytes + ' bytes' + (over ? '  — OVER LIMIT, Gmail will clip this' : ''),
        over ? 'bad' : '');
    }).withFailureHandler(fail('previewError')).previewCampaign(currentCampaignId, {
      first_name: $('sampleFirstName').value, company: $('sampleCompany').value,
      title: $('sampleTitle').value, custom: {},
    });
  }
  $('btnPreview').onclick = doPreview;

  $('btnSeed').onclick = function () {
    setMsg('seedStatus', 'Queuing…');
    google.script.run.withSuccessHandler(function () {
      setMsg('seedStatus', 'Queued — sends on the next agent poll. Check the seed inboxes before marking passed.', 'good');
      $('btnMarkSeed').disabled = false;
    }).withFailureHandler(fail('seedStatus')).enqueueSeedSend(currentCampaignId);
  };
  $('btnMarkSeed').onclick = function () {
    if (!confirm('Confirm you have opened the seed mailboxes and the rendering looked correct?')) return;
    google.script.run.withSuccessHandler(function () {
      setMsg('seedStatus', 'Seed pass recorded — valid 24 hours.', 'good'); refreshCampaigns();
    }).withFailureHandler(fail('seedStatus')).markSeedPassed(currentCampaignId);
  };

  // ── audience ──────────────────────────────────────────────────
  $('btnTemplate').onclick = function () {
    const csv = 'email,first_name,last_name,company,title,recipient_tz,intro_html\n'
      + 'sam@example.com,Sam,Prospect,Example Corp,VP Engineering,Asia/Kolkata,"<strong>scaling fast</strong>"\n';
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'outreach-recipients-template.csv'; a.click();
    URL.revokeObjectURL(url);
  };

  const drop = $('drop');
  drop.onclick = function () { $('fileInput').click(); };
  drop.ondragover = function (e) { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = function () { drop.classList.remove('over'); };
  drop.ondrop = function (e) {
    e.preventDefault(); drop.classList.remove('over');
    if (e.dataTransfer.files.length) readCsv(e.dataTransfer.files[0]);
  };
  $('fileInput').onchange = function (e) { if (e.target.files.length) readCsv(e.target.files[0]); };

  // Read client-side and send the text: google.script.run cannot accept a File,
  // and a list small enough for this tool is small enough to pass as a string.
  function readCsv(file) {
    const reader = new FileReader();
    reader.onload = function () {
      pendingCsvText = reader.result;
      renderCsvPreview(file.name, pendingCsvText);
      $('btnImport').disabled = !currentCampaignId;
      if (!currentCampaignId) setMsg('importStatus', 'Save the campaign first, then import.', 'bad');
    };
    reader.readAsText(file);
  }

  function renderCsvPreview(fileName, text) {
    const lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
    const cells = lines.slice(0, 6).map(function (l) { return l.split(','); });
    const head = (cells[0] || []).map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('');
    const body = cells.slice(1).map(function (r) {
      return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
    }).join('');
    $('csvPreview').innerHTML = '<div class="hint" style="margin-top:8px">' + esc(fileName) + ' — '
      + (lines.length - 1) + ' data row(s), showing up to 5</div>'
      + '<table class="mini"><tr>' + head + '</tr>' + body + '</table>';
  }

  $('btnImport').onclick = function () {
    setMsg('importStatus', 'Importing…');
    google.script.run.withSuccessHandler(function (r) {
      setMsg('importStatus', 'Imported ' + r.imported + ' · duplicates ' + r.duplicates
        + ' · suppressed ' + r.suppressed + ' · invalid ' + r.invalid
        + (r.invalid ? '\nRows needing attention: ' + r.invalidRows.map(function (x) {
            return x.row + (x.reason ? ' (' + x.reason + ')' : '');
          }).join(', ') : ''), r.invalid ? 'bad' : 'good');
    }).withFailureHandler(fail('importStatus')).importRecipientsCsv(currentCampaignId, pendingCsvText);
  };

  $('btnSuppress').onclick = function () {
    if (!confirm('Suppression is permanent and global — these addresses will never receive mail from any campaign or sender again.')) return;
    google.script.run.withSuccessHandler(function (r) {
      setMsg('suppressStatus', 'Suppressed ' + r.suppressed
        + (r.invalid.length ? ' · unparsed: ' + r.invalid.join(', ') : ''), 'good');
      $('suppressText').value = '';
    }).withFailureHandler(fail('suppressStatus'))
      .manuallySuppressBulk($('suppressText').value, 'unsubscribe request relayed by sender');
  };
  $('btnMarkReplied').onclick = function () {
    google.script.run.withSuccessHandler(function (r) {
      setMsg('repliedStatus', 'Updated ' + r.updated + ' row(s).', 'good'); $('repliedEmail').value = '';
    }).withFailureHandler(fail('repliedStatus')).manuallyMarkReplied(currentCampaignId, $('repliedEmail').value);
  };

  // ── launch ────────────────────────────────────────────────────
  $('btnPreflight').onclick = function () {
    google.script.run.withSuccessHandler(function (r) {
      $('preflightResults').innerHTML = r.checks.map(function (c) {
        const advisory = c.blocking === false;
        const label = c.ok ? 'PASS' : (advisory ? 'NOTE' : 'BLOCKED');
        const colour = c.ok ? 'var(--good)' : (advisory ? 'var(--warn)' : 'var(--bad)');
        return '<div style="font-size:12px;color:' + colour + '">' + label + ' — ' + esc(c.name)
          + (c.detail ? ' · ' + esc(c.detail) : '') + '</div>';
      }).join('');
    }).withFailureHandler(function (err) {
      $('preflightResults').innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>';
    }).checkPreflight(currentCampaignId);
  };
  $('btnApprove').onclick = function () {
    google.script.run.withSuccessHandler(function () { setMsg('launchStatus', 'Approved.', 'good'); })
      .withFailureHandler(fail('launchStatus')).approveCampaignAsExec(currentCampaignId);
  };
  $('btnLaunchCanary').onclick = function () {
    if (!confirm('Launch the canary — real mail to the first 5 real recipients. This cannot be undone.')) return;
    setMsg('launchStatus', 'Launching…');
    google.script.run.withSuccessHandler(function () {
      setMsg('launchStatus', 'Canary launched. Review what actually went out before releasing the rest.', 'good');
      refreshCampaigns();
    }).withFailureHandler(fail('launchStatus')).launchCampaignCanary(currentCampaignId);
  };
  $('btnReleaseCanary').onclick = function () {
    if (!confirm('Release every remaining recipient into the send queue?')) return;
    google.script.run.withSuccessHandler(function () {
      setMsg('launchStatus', 'Remaining recipients scheduled.', 'good'); refreshCampaigns();
    }).withFailureHandler(fail('launchStatus')).releaseCanary(currentCampaignId);
  };

  // ── health ────────────────────────────────────────────────────
  function card(value, label, colour) {
    return '<div class="card"><b' + (colour ? ' style="color:' + colour + '"' : '') + '>' + esc(value) + '</b>'
      + '<span>' + esc(label) + '</span></div>';
  }

  function refreshHealth() {
    $('healthAge').textContent = ' loading…';
    google.script.run.withSuccessHandler(function (h) {
      const s = h.system;
      $('healthAge').textContent = ' as of ' + new Date(h.generatedAt).toLocaleTimeString();
      $('systemCards').innerHTML =
          card(s.killSwitch ? 'STOPPED' : 'running', 'sending', s.killSwitch ? 'var(--bad)' : 'var(--good)')
        + card(s.sendersActive + '/' + s.sendersTotal, 'senders live', s.sendersActive ? '' : 'var(--warn)')
        + card(s.sentAllTime, 'sent all time')
        + card(s.repliedAllTime + ' (' + s.replyRatePct + '%)', 'replies recorded')
        + card(s.bouncedAllTime + ' (' + s.bounceRatePct + '%)', 'bounces · halts at ' + s.bounceHaltAt + '%',
               s.bounceRatePct > s.bounceHaltAt ? 'var(--bad)' : '')
        + card(s.suppressionCount, 'suppressed')
        + (s.signalsDegraded ? card(s.signalsDegraded, 'agents without reply detection', 'var(--warn)') : '');

      $('healthSenders').innerHTML = h.senders.length ? h.senders.map(function (x) {
        const pct = Math.min(100, x.capUsedPct);
        return '<div class="row"><span>' + esc(x.displayName) + ' &lt;' + esc(x.email) + '&gt;'
          + '<div class="hint">' + esc(x.transport)
          + ' · ' + (x.signalsWorking ? '<span style="color:var(--good)">reply detection on</span>'
                                      : '<span style="color:var(--warn)">reply detection off</span>')
          + ' · ' + (x.stale ? '<span style="color:var(--bad)">no recent heartbeat</span>' : 'live')
          + ' · agent ' + esc(x.agentVersion) + ' · ' + esc(x.providerQuota) + ' provider sends left</div>'
          + '<div class="hint">' + x.sentToday + ' / ' + x.capToday + ' of today\'s cap'
          + '<div class="bar" style="color:' + (pct > 90 ? 'var(--warn)' : 'var(--good)') + '">'
          + '<i style="width:' + pct + '%"></i></div></div>'
          + '</span><span class="pill">' + esc(x.status) + '</span></div>';
      }).join('') : '<div class="hint">No senders onboarded.</div>';

      $('healthCampaigns').innerHTML = h.campaigns.length ? '<table class="mini">'
        + '<tr><th>Campaign</th><th>Status</th><th>Total</th><th>Sent</th><th>Replied</th>'
        + '<th>Bounced</th><th>Opted out</th><th>Failed</th><th>Queued</th><th>Next due</th></tr>'
        + h.campaigns.map(function (c) {
          return '<tr><td>' + esc(c.name) + '</td><td>' + esc(c.status) + '</td><td>' + c.total + '</td>'
            + '<td>' + c.sent + '</td><td>' + c.replied + '</td><td>' + c.bounced + '</td>'
            + '<td>' + c.unsubscribed + '</td>'
            + '<td' + (c.failed ? ' style="color:var(--bad)"' : '') + '>' + c.failed + '</td>'
            + '<td>' + c.pendingSends + '</td>'
            + '<td>' + (c.nextDue ? new Date(c.nextDue).toLocaleString() : '—') + '</td></tr>';
        }).join('') + '</table>' : '<div class="hint">No campaigns yet.</div>';

      $('healthFailures').innerHTML = h.failures.length ? '<table class="mini">'
        + '<tr><th>Queue row</th><th>Sender</th><th>Attempts</th><th>Error</th></tr>'
        + h.failures.map(function (f) {
          return '<tr><td>' + esc(f.id) + '</td><td>' + esc(f.sender) + '</td><td>' + esc(f.attempts) + '</td>'
            + '<td style="white-space:normal;color:var(--bad)">' + esc(f.error) + '</td></tr>';
        }).join('') + '</table>' : '<div class="hint" style="color:var(--good)">No failures recorded.</div>';

      $('healthEvents').innerHTML = h.events.length ? '<table class="mini">'
        + '<tr><th>When</th><th>Who</th><th>What</th><th>Detail</th></tr>'
        + h.events.map(function (e) {
          return '<tr><td>' + (e.ts ? new Date(e.ts).toLocaleString() : '') + '</td>'
            + '<td>' + esc(e.actor) + '</td><td>' + esc(e.type) + '</td>'
            + '<td style="white-space:normal">' + esc(e.detail) + '</td></tr>';
        }).join('') + '</table>' : '<div class="hint">No events yet.</div>';
    }).withFailureHandler(function (err) {
      $('healthAge').textContent = '';
      $('systemCards').innerHTML = '<div class="msg bad">' + esc(err.message) + '</div>';
    }).getHealthSnapshot();
  }
  $('btnRefreshHealth').onclick = refreshHealth;

  // ── shared chrome ─────────────────────────────────────────────
  function refreshKillSwitch() {
    google.script.run.withSuccessHandler(function (on) {
      const el = $('killSwitchState');
      el.textContent = on ? 'KILL SWITCH ON' : 'sending enabled';
      el.style.background = on ? '#f5c2c2' : '#c8f0c8';
      el.style.color = '#1a1a1a';
    }).getKillSwitchStatus();
  }
  $('btnToggleKill').onclick = function () {
    const on = $('killSwitchState').textContent.indexOf('ON') !== -1;
    if (!on && !confirm('Stop every sender? Nothing will send until this is turned back on.')) return;
    google.script.run.withSuccessHandler(refreshKillSwitch).setKillSwitch(!on);
  };

  function refreshCampaigns() {
    google.script.run.withSuccessHandler(function (cs) {
      $('campaignList').innerHTML = cs.length ? cs.map(function (c) {
        return '<div class="row"><span>' + esc(c.name) + '<div class="hint">' + esc(c.id)
          + (c.interval_minutes ? ' · ' + esc(c.interval_minutes) + ' min gap' : ' · auto-spaced')
          + (c.projected_completion ? ' · finishes ' + esc(c.projected_completion) : '') + '</div></span>'
          + '<span class="pill">' + esc(c.status) + '</span></div>';
      }).join('') : '<div class="hint">No campaigns yet.</div>';
    }).listCampaigns();
  }

  refreshKillSwitch();
  refreshCampaigns();
</script>
