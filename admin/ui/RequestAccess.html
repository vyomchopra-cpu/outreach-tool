<!--
  Standalone entry point for a signed-in @REPLY_TO_DOMAIN user who is NOT yet
  an authorized admin. Reached directly from doGet (admin/Code.gs) — this is
  a real top-level template (createTemplateFromFile().evaluate()), not a
  partial spliced in via include_(), so <?= ?> scriptlets below actually run.
-->
<style>
  :root { color-scheme: light dark; --bg:#fbfbfd; --ink:#15161a; --muted:#6b6f76; --line:#e4e6eb; --accent:#3b5bfd; --accent-soft:#eef1ff; --good:#12805c; --good-soft:#e6f6f0; --bad:#c02b3a; --bad-soft:#fdecee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --ink:#e9eaee; --muted:#9aa0aa; --line:#272b34; --accent:#7d92ff; --accent-soft:#1c2242; --good:#4ecf9a; --good-soft:#132a22; --bad:#ef6b7a; --bad-soft:#2e1a1e; } }
  * { box-sizing: border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--ink); margin:0; padding:32px 20px 80px; line-height:1.5; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .card { background: color-mix(in srgb, var(--bg) 92%, var(--ink) 4%); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; margin-bottom: 20px; }
  label { display: block; font-size: 12px; font-weight: 600; margin: 14px 0 5px; }
  label:first-child { margin-top: 0; }
  .hint { color: var(--muted); font-size: 12px; font-weight: 400; }
  input, select, textarea { width: 100%; padding: 9px 10px; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font-family: inherit; }
  button { padding: 9px 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-size: 13px; cursor: pointer; margin-top: 14px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .msg { font-size: 12.5px; margin-top: 10px; white-space: pre-wrap; }
  .msg.bad { color: var(--bad); } .msg.good { color: var(--good); }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .row:last-child { border-bottom: none; }
  .pill { font-size: 11px; padding: 2px 9px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .pill.approved { background: var(--good-soft); color: var(--good); }
  .pill.denied { background: var(--bad-soft); color: var(--bad); }
</style>

<div class="wrap">
  <h1>Request access — MIS Outreach</h1>
  <div class="sub">Signed in as <strong><?= userEmail ?></strong>. You don't have console access yet — request it below from whoever should approve it.</div>

  <div class="card">
    <label>What are you requesting?</label>
    <select id="kind">
      <option value="console">Console access — build and launch campaigns</option>
      <option value="sending">Sending access — mail under my own name (needs a separate one-time agent authorization too)</option>
    </select>

    <label>Approve by <span class="hint">the person who should decide this — they'll get the same kind of link, and only they can act on it</span></label>
    <input type="text" id="approver" placeholder="their.email@moveinsync.com">

    <label>Days requested</label>
    <input type="number" id="days" min="1" max="365" value="14">

    <label>Reason <span class="hint">shown to the approver</span></label>
    <textarea id="reason" rows="2" placeholder="Covering the outreach launch this week"></textarea>

    <button id="btnSubmit">Submit request</button>
    <div id="status" class="msg"></div>
  </div>

  <div class="card">
    <strong style="font-size:13px">Your requests</strong>
    <div id="myRequests" style="margin-top:10px" class="hint">Loading…</div>
  </div>
</div>

<script>
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function refreshMine() {
    google.script.run.withSuccessHandler(function (rows) {
      $('myRequests').innerHTML = rows.length ? rows.map(function (r) {
        return '<div class="row"><span>' + esc(r.kind) + ' · ' + r.days + 'd · approver ' + esc(r.approverEmail) + '</span>'
          + '<span class="pill ' + r.status + '">' + esc(r.status) + '</span></div>';
      }).join('') : '<div class="hint">None yet.</div>';
    }).listMyRequests();
  }
  refreshMine();

  $('btnSubmit').onclick = function () {
    const btn = $('btnSubmit');
    btn.disabled = true;
    $('status').textContent = 'Submitting…'; $('status').className = 'msg';
    google.script.run.withSuccessHandler(function () {
      $('status').textContent = 'Sent. Reload this page any time to check its status.';
      $('status').className = 'msg good';
      $('approver').value = ''; $('reason').value = '';
      btn.disabled = false;
      refreshMine();
    }).withFailureHandler(function (err) {
      $('status').textContent = 'Error: ' + err.message;
      $('status').className = 'msg bad';
      btn.disabled = false;
    }).requestAccess($('kind').value, $('approver').value.trim(), $('days').value, $('reason').value);
  };
</script>
